<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planificateur de Vacances — v1.0</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0078d7">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toastContainer" class="toast-container" aria-live="polite"></div>

<div id="modalOverlay" class="modal-overlay" hidden>
<div class="modal-box" role="dialog" aria-modal="true">
<p id="modalMessage"></p>
<div class="modal-actions">
<button id="modalCancel" class="modal-btn modal-btn-cancel">Annuler</button>
<button id="modalConfirm" class="modal-btn modal-btn-confirm">Confirmer</button>
</div>
</div>
</div>

<div id="printView"></div>

<div class="corner-menu">

<div class="corner-menu-item">
<button id="optionsMenuBtn" class="icon-btn options-menu-trigger" type="button" title="Options" aria-label="Ouvrir le menu options" aria-haspopup="true" aria-expanded="false">⋮</button>
<div id="optionsMenuPanel" class="options-menu-panel" role="menu" hidden>

<div class="menu-section-label">Données</div>
<button id="importBtn" class="menu-item" type="button" role="menuitem" title="Importer (Excel / CSV / texte)" aria-label="Importer un fichier Excel, CSV ou texte"><span class="menu-item-icon">📂</span><span class="menu-item-label">Importer un fichier</span></button>
<input type="file" id="importFile" accept=".xlsx,.xls,.csv,.txt" hidden>
<button id="templateBtn" class="menu-item" type="button" role="menuitem" title="Télécharger le modèle" aria-label="Télécharger le modèle CSV"><span class="menu-item-icon">📄</span><span class="menu-item-label">Télécharger le modèle</span></button>
<button id="exportDataBtn" class="menu-item" type="button" role="menuitem" title="Exporter mes données (sauvegarde JSON)" aria-label="Exporter mes données en JSON"><span class="menu-item-icon">💾</span><span class="menu-item-label">Exporter mes données</span></button>
<button id="importDataBtn" class="menu-item" type="button" role="menuitem" title="Importer mes données (sauvegarde JSON)" aria-label="Importer mes données depuis un JSON"><span class="menu-item-icon">📥</span><span class="menu-item-label">Importer mes données</span></button>
<input type="file" id="importDataFile" accept=".json" hidden>

<div class="menu-divider"></div>
<div class="menu-section-label">Affichage</div>
<button id="themeToggle" class="menu-item" type="button" role="menuitem" title="Mode sombre" aria-label="Basculer le mode sombre"><span class="menu-item-icon">🌙</span><span class="menu-item-label">Mode sombre</span></button>
<button id="layoutToggle" class="menu-item" type="button" role="menuitem" title="Mode auto" aria-label="Changer le mode d'affichage"><span class="menu-item-icon">🔄</span><span class="menu-item-label">Affichage : Auto</span></button>
<button id="printBtn" class="menu-item" type="button" role="menuitem" title="Exporter en PDF / Imprimer" aria-label="Exporter le planning en PDF"><span class="menu-item-icon">🖨️</span><span class="menu-item-label">Exporter en PDF</span></button>

<div class="menu-divider"></div>
<button id="resetPlanning" class="menu-item menu-item-danger" type="button" role="menuitem" title="Réinitialiser le planning" aria-label="Réinitialiser tout le planning"><span class="menu-item-icon">🗑️</span><span class="menu-item-label">Réinitialiser le planning</span></button>

</div>
</div>

<div class="corner-menu-item">
<button id="searchToggleBtn" class="icon-btn" type="button" title="Rechercher" aria-label="Ouvrir la recherche" aria-haspopup="true" aria-expanded="false">🔍</button>
<div id="searchPanel" class="search-panel" hidden>
<input type="text" id="globalSearch" placeholder="Rechercher une activité, une adresse…" autocomplete="off">
<div id="searchResults" class="search-results"></div>
</div>
</div>

<div class="corner-menu-item" id="dateMenuItem" hidden>
<button id="dateToggleBtn" class="icon-btn" type="button" title="Réglages du voyage" aria-label="Ouvrir les réglages du voyage" aria-haspopup="true" aria-expanded="false">⚙️</button>
<div id="datePanel" class="date-panel" hidden></div>
</div>

</div>

<h1>🌴 Planification de Vacances</h1>

<div id="countdownBanner" class="countdown-banner" hidden></div>

<div id="dateInlineSlot">
<div class="date-wrap" id="dateWrap">
<div class="date-wrap-row">
<label for="startDate">🗓️ Date de départ (optionnel) :</label>
<input type="date" id="startDate">
<button id="jumpTodayBtn" class="jump-today-btn" type="button" hidden>📍 Aujourd'hui</button>
</div>
<div class="date-wrap-row">
<label for="dayCount">🗓️ Nombre de jours :</label>
<input type="number" id="dayCount" min="1" max="30" value="7">
</div>
<div class="date-wrap-row">
<label for="targetCurrency">💱 Devise du convertisseur :</label>
<select id="targetCurrency">
<option value="JPY">¥ Yen (JPY)</option>
<option value="EUR">€ Euro (EUR)</option>
</select>
</div>
</div>
</div>

<div id="tripSummary" class="trip-summary"></div>

<div class="converter-card">
<div class="converter-head">
<span class="converter-icon">💱</span>
<h3 id="converterTitle">GBP ↔ JPY</h3>
</div>
<div class="converter-row">
<div class="converter-field">
<label for="gbpInput">£</label>
<input type="number" id="gbpInput" placeholder="0" step="0.01">
</div>
<span class="converter-eq">⇄</span>
<div class="converter-field">
<label for="targetInput" id="targetFieldLabel">¥</label>
<input type="number" id="targetInput" placeholder="0" step="1">
</div>
</div>
<div id="rateInfo" class="rate-info">Chargement du taux…</div>
</div>

<button id="checklistToggle" class="form-toggle-btn checklist-toggle-btn" type="button">
<span>🎒</span><span id="checklistToggleLabel">Checklist de voyage</span>
</button>
<div id="checklistDrawer" class="form-drawer">
<div class="form-drawer-inner">
<div id="checklistItems" class="checklist-items"></div>
<div class="checklist-add-row">
<input type="text" id="checklistNewItem" placeholder="Ajouter un élément…">
<button id="checklistAddBtn" class="add" type="button">Ajouter</button>
</div>
</div>
</div>


<div class="day-select-wrap">
<label for="daySelect">📅 Jour :</label>
<select id="daySelect"></select>
</div>
<div class="day-content">
<h2 id="dayTitle"></h2>

<button id="formToggle" class="form-toggle-btn" type="button">
<span id="formToggleIcon">➕</span><span id="formToggleLabel">Ajouter une activité</span>
</button>

<div id="formDrawer" class="form-drawer">
<div class="form-drawer-inner">
<div class="form">
<input
type="text"
id="activityName"
placeholder="Nom de l'activité">
<input
type="text"
id="activityAddress"
placeholder="Adresse (optionnel)">
<select id="activityType">
<option>Restaurant</option>
<option>Musée</option>
<option>Bar</option>
<option>Visite</option>
<option>Randonnée</option>
<option>Shopping</option>
<option>Logement</option>
<option>Spectacle</option>
<option>Incontournable</option>
<option>Pépite locale</option>
<option>Pratique</option>
</select>
<select id="timeSlot">
<option value="matin">🌅 Matin</option>
<option value="midi">🍽️ Midi</option>
<option value="apresMidi">☀️ Après-midi</option>
<option value="soir">🌙 Soir</option>
</select>
<input
type="number"
id="activityPrice"
placeholder="Prix (£)"
min="0"
step="0.01">
<input
type="number"
id="activityTravelTime"
placeholder="Trajet (min)"
min="0"
step="1">
<button class="add" onclick="addActivity()">
Ajouter
</button>
</div>
</div>
</div>

<div id="daySummary"></div>
<div id="activities"></div>
</div>
<script src="app.js"></script>

</body>
</html>
